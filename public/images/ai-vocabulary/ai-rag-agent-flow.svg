<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">AI 工程落地的完整知识地图</title><desc id="desc">本图覆盖提示词工程、RAG、LangChain、LlamaIndex、向量数据库、Agent、部署方式和评估指标。</desc><rect width="1200" height="680" fill="#f8fafc"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif"><text x="70" y="70" fill="#475569" font-size="19">从说清需求到连接数据、执行动作、上线监控，本篇的工具和方法各在不同环节发挥作用。</text><path d="M120 160H1080" stroke="#cbd5e1" stroke-width="5"/><circle cx="120" cy="160" r="14" fill="#38bdf8"/><circle cx="360" cy="160" r="14" fill="#a78bfa"/><circle cx="600" cy="160" r="14" fill="#f59e0b"/><circle cx="840" cy="160" r="14" fill="#ec4899"/><circle cx="1080" cy="160" r="14" fill="#22c55e"/>
<text x="70" y="220" fill="#075985" font-size="22" font-weight="700">明确任务</text><text x="70" y="256" fill="#0f172a" font-size="20" font-weight="700">提示词工程</text><text x="70" y="291" fill="#475569" font-size="17">角色、示例、格式、约束</text>
<text x="285" y="220" fill="#5b21b6" font-size="22" font-weight="700">连接知识</text><text x="285" y="256" fill="#0f172a" font-size="20" font-weight="700">RAG · 向量数据库</text><text x="285" y="291" fill="#475569" font-size="17">检索私有或最新资料</text>
<text x="535" y="220" fill="#92400e" font-size="22" font-weight="700">编排流程</text><text x="535" y="256" fill="#0f172a" font-size="20" font-weight="700">LangChain · LlamaIndex</text><text x="535" y="291" fill="#475569" font-size="17">把模型、检索、工具组织起来</text>
<text x="785" y="220" fill="#9d174d" font-size="22" font-weight="700">执行任务</text><text x="785" y="256" fill="#0f172a" font-size="20" font-weight="700">Agent · 工具调用</text><text x="785" y="291" fill="#475569" font-size="17">多步规划、查询与行动</text>
<text x="1015" y="220" fill="#166534" font-size="22" font-weight="700">上线迭代</text><text x="1015" y="256" fill="#0f172a" font-size="20" font-weight="700">部署 · 评估</text><text x="1015" y="291" fill="#475569" font-size="17">质量、成本、速度与监控</text>
<rect x="70" y="415" width="1060" height="120" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="104" y="460" fill="#0f172a" font-size="23" font-weight="700">选型不是升级打怪</text><text x="104" y="497" fill="#475569" font-size="19">只需稳定生成内容：先打磨 Prompt。需要回答公司资料：再引入 RAG。需要跨系统、多步骤地执行操作：才考虑 Agent。</text>
<rect x="70" y="585" width="1060" height="42" rx="8" fill="#e0f2fe"/><text x="95" y="613" fill="#075985" font-size="18" font-weight="700">无论选哪条路径，最终都需要通过部署与评估，确认它真的能服务用户。</text></g></svg>
