<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">AI 应用可靠性知识地图</title><desc id="desc">本图覆盖 System Prompt、上下文窗口、Tool Calling、MCP、Guardrails 和可观测性，展示它们如何让模型可靠完成任务。</desc><rect width="1200" height="680" fill="#f8fafc"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif"><text x="70" y="70" fill="#475569" font-size="19">模型会聊天只是起点。可靠的应用还需要明确职责、组织信息、安全执行，并能持续复盘。</text><path d="M150 160H1050" stroke="#cbd5e1" stroke-width="5"/><circle cx="150" cy="160" r="14" fill="#38bdf8"/><circle cx="450" cy="160" r="14" fill="#a78bfa"/><circle cx="750" cy="160" r="14" fill="#f59e0b"/><circle cx="1050" cy="160" r="14" fill="#ec4899"/>
<text x="80" y="220" fill="#075985" font-size="25" font-weight="700">定义职责</text><text x="80" y="256" fill="#0f172a" font-size="21" font-weight="700">System Prompt</text><text x="80" y="291" fill="#475569" font-size="18">角色、边界、输出规则，</text><text x="80" y="319" fill="#475569" font-size="18">相当于岗位说明书。</text>
<text x="380" y="220" fill="#5b21b6" font-size="25" font-weight="700">组织信息</text><text x="380" y="256" fill="#0f172a" font-size="21" font-weight="700">Context Window</text><text x="380" y="291" fill="#475569" font-size="18">只把当前最相关的历史、</text><text x="380" y="319" fill="#475569" font-size="18">资料和结果放上“桌面”。</text>
<text x="680" y="220" fill="#92400e" font-size="25" font-weight="700">连接与执行</text><text x="680" y="256" fill="#0f172a" font-size="21" font-weight="700">Tool Calling · MCP</text><text x="680" y="291" fill="#475569" font-size="18">模型提出请求，程序校验并</text><text x="680" y="319" fill="#475569" font-size="18">执行；MCP 统一连接方式。</text>
<text x="980" y="220" fill="#9d174d" font-size="25" font-weight="700">安全与改进</text><text x="980" y="256" fill="#0f172a" font-size="21" font-weight="700">Guardrails · 可观测性</text><text x="980" y="291" fill="#475569" font-size="18">限制高风险操作，留下能</text><text x="980" y="319" fill="#475569" font-size="18">复盘质量、成本的记录。</text>
<rect x="70" y="415" width="1060" height="120" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="104" y="460" fill="#0f172a" font-size="23" font-weight="700">一次可靠的任务处理</text><text x="104" y="497" fill="#475569" font-size="19">系统提示词定边界 → 按需组织上下文 → 模型提出工具请求 → 后端校验并执行 → 护栏拦住风险 → 日志和评测记录结果。</text>
<rect x="70" y="585" width="1060" height="42" rx="8" fill="#e0f2fe"/><text x="95" y="613" fill="#075985" font-size="18" font-weight="700">关键判断：模型可以参与决策，但权限、高风险动作和最终执行权必须留在应用系统手中。</text></g></svg>
