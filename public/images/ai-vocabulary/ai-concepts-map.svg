<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">AI 基础概念的完整知识地图</title><desc id="desc">本图覆盖文章中的 AI、LLM、AIGC、Prompt、RAG、Agent、多模态、涌现、对齐和幻觉。</desc><rect width="1200" height="680" fill="#f8fafc"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif"><text x="70" y="70" fill="#475569" font-size="19">全文的十个词可分成四组。按这个顺序读，能知道它们各自在解决什么问题。</text><path d="M150 160H1050" stroke="#cbd5e1" stroke-width="5"/><circle cx="150" cy="160" r="14" fill="#38bdf8"/><circle cx="450" cy="160" r="14" fill="#a78bfa"/><circle cx="750" cy="160" r="14" fill="#f59e0b"/><circle cx="1050" cy="160" r="14" fill="#ec4899"/>
<text x="80" y="220" fill="#075985" font-size="25" font-weight="700">能力底座</text><text x="80" y="256" fill="#0f172a" font-size="21" font-weight="700">AI · LLM</text><text x="80" y="291" fill="#475569" font-size="18">AI 是总称；LLM 是</text><text x="80" y="319" fill="#475569" font-size="18">其中的语言能力核心。</text>
<text x="380" y="220" fill="#5b21b6" font-size="25" font-weight="700">交互与产物</text><text x="380" y="256" fill="#0f172a" font-size="21" font-weight="700">Prompt · AIGC · 多模态</text><text x="380" y="291" fill="#475569" font-size="18">控制模型表达，并生成</text><text x="380" y="319" fill="#475569" font-size="18">文、图、音、视频等内容。</text>
<text x="680" y="220" fill="#92400e" font-size="25" font-weight="700">知识与可靠性</text><text x="680" y="256" fill="#0f172a" font-size="21" font-weight="700">RAG · 幻觉 · 对齐</text><text x="680" y="291" fill="#475569" font-size="18">给回答提供依据，也认识</text><text x="680" y="319" fill="#475569" font-size="18">模型可能出错的边界。</text>
<text x="980" y="220" fill="#9d174d" font-size="25" font-weight="700">复杂能力</text><text x="980" y="256" fill="#0f172a" font-size="21" font-weight="700">Agent · 涌现</text><text x="980" y="291" fill="#475569" font-size="18">协调工具完成多步任务，</text><text x="980" y="319" fill="#475569" font-size="18">并观察规模带来的新能力。</text>
<rect x="70" y="415" width="1060" height="120" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="104" y="460" fill="#0f172a" font-size="23" font-weight="700">概念之间怎样协作？</text><text x="104" y="497" fill="#475569" font-size="19">LLM 通过 Prompt 接受指令；要回答私有或最新资料时加 RAG；要调用外部系统、完成多步目标时再由 Agent 协调工具。</text>
<rect x="70" y="585" width="1060" height="42" rx="8" fill="#e0f2fe"/><text x="95" y="613" fill="#075985" font-size="18" font-weight="700">读完本篇应能判断：我要的是“生成内容”、“回答有依据”，还是“替我完成多步任务”？</text></g></svg>
