<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">大模型架构与训练的完整知识地图</title><desc id="desc">本图覆盖文章中的 Transformer、Attention、Embedding、预训练、微调、LoRA、MoE、采样参数以及 Epoch、Batch 和学习率。</desc><rect width="1200" height="680" fill="#f8fafc"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif"><text x="70" y="70" fill="#475569" font-size="19">本篇所有术语都在同一条生命周期上，但“架构”“训练方法”和“推理参数”不是一回事。</text>
<path d="M150 170H1050" stroke="#cbd5e1" stroke-width="5"/><circle cx="150" cy="170" r="14" fill="#38bdf8"/><circle cx="450" cy="170" r="14" fill="#a78bfa"/><circle cx="750" cy="170" r="14" fill="#f59e0b"/><circle cx="1050" cy="170" r="14" fill="#ec4899"/>
<text x="80" y="230" fill="#075985" font-size="25" font-weight="700">表示输入</text><text x="80" y="266" fill="#0f172a" font-size="21" font-weight="700">Token · Embedding</text><text x="80" y="301" fill="#475569" font-size="18">文字如何变成数字向量？</text>
<text x="350" y="230" fill="#5b21b6" font-size="25" font-weight="700">模型骨架</text><text x="350" y="266" fill="#0f172a" font-size="21" font-weight="700">Transformer · Attention · MoE</text><text x="350" y="301" fill="#475569" font-size="18">模型怎样找上下文关系？</text>
<text x="650" y="230" fill="#92400e" font-size="25" font-weight="700">训练与适配</text><text x="650" y="266" fill="#0f172a" font-size="21" font-weight="700">预训练 · 微调 · LoRA</text><text x="650" y="301" fill="#475569" font-size="18">能力从哪里来，如何适配任务？</text>
<text x="950" y="230" fill="#9d174d" font-size="25" font-weight="700">推理输出</text><text x="950" y="266" fill="#0f172a" font-size="21" font-weight="700">Temperature · Top-p · Top-k</text><text x="950" y="301" fill="#475569" font-size="18">回答怎样更稳定或更发散？</text>
<rect x="70" y="385" width="1060" height="120" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="102" y="429" fill="#0f172a" font-size="23" font-weight="700">贯穿训练过程的三个刻度：Epoch · Batch · Learning Rate</text><text x="102" y="466" fill="#475569" font-size="19">它们不属于某一层模型结构，而是控制“数据看几遍、每次喂多少、每一步调多大”的训练参数。</text>
<rect x="70" y="555" width="1060" height="78" rx="8" fill="#fef3c7"/><text x="100" y="603" fill="#92400e" font-size="19" font-weight="700">阅读顺序：先 Embedding → Transformer / Attention → 预训练与微调 / LoRA / MoE → 最后再看 Temperature、Top-p、Top-k。</text></g></svg>
