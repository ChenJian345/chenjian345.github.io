<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">大模型架构与训练的知识地图</title><desc id="desc">本图从输入表示、模型骨架、训练与适配、推理输出四个视角梳理术语；它们不是先后相继的训练阶段。</desc><rect width="1200" height="680" fill="#f8fafc"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif"><text x="70" y="70" fill="#475569" font-size="19">从四个视角看模型：输入表示、模型骨架、训练与适配、推理输出。</text>
<path d="M150 170H1050" stroke="#cbd5e1" stroke-width="5"/><circle cx="150" cy="170" r="14" fill="#38bdf8"/><circle cx="450" cy="170" r="14" fill="#a78bfa"/><circle cx="750" cy="170" r="14" fill="#f59e0b"/><circle cx="1050" cy="170" r="14" fill="#ec4899"/>
<text x="80" y="230" fill="#075985" font-size="25" font-weight="700">表示输入</text><text x="80" y="266" fill="#0f172a" font-size="21" font-weight="700">Token · Embedding</text><text x="80" y="301" fill="#475569" font-size="18">文字如何变成数字向量？</text>
<text x="350" y="230" fill="#5b21b6" font-size="25" font-weight="700">模型骨架</text><text x="350" y="266" fill="#0f172a" font-size="20" font-weight="700">Transformer · Attention</text><text x="350" y="301" fill="#475569" font-size="18">MoE 按需选择专家</text>
<text x="650" y="230" fill="#92400e" font-size="25" font-weight="700">训练与适配</text><text x="650" y="266" fill="#0f172a" font-size="21" font-weight="700">预训练 · 微调 · LoRA</text><text x="650" y="301" fill="#475569" font-size="18">LoRA 是微调方法之一</text>
<text x="950" y="230" fill="#9d174d" font-size="25" font-weight="700">推理输出</text><text x="950" y="266" fill="#0f172a" font-size="20" font-weight="700">Temperature · Top-p</text><text x="950" y="301" fill="#475569" font-size="18">Top-k 调节采样范围</text>
<rect x="70" y="385" width="1060" height="120" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="102" y="429" fill="#0f172a" font-size="23" font-weight="700">贯穿训练过程的三个刻度：Epoch · Batch · Learning Rate</text><text x="102" y="466" fill="#475569" font-size="19">它们不属于某一层模型结构，而是控制“数据看几遍、每次喂多少、每一步调多大”的训练参数。</text>
<rect x="70" y="555" width="1060" height="78" rx="8" fill="#fef3c7"/><text x="100" y="591" fill="#92400e" font-size="19" font-weight="700">架构：Embedding、Transformer、Attention、MoE</text><text x="100" y="618" fill="#92400e" font-size="19" font-weight="700">训练：预训练、微调、LoRA、Epoch / Batch / LR　·　推理：Temperature、Top-p、Top-k</text></g></svg>
