version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # 禁用自动合并，需要手动审查
    # 不设置 auto-merge 相关配置
    # 限制只更新 patch 和 minor 版本，避免 major 版本 breaking changes
    ignore:
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@astrojs/*"
        update-types: ["version-update:semver-major"]
